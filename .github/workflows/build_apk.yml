name: Build Flutter APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # This tells GitHub to run all terminal commands inside your yellow_pages/yellow_pages folder
    defaults:
      run:
        working-directory: ./yellow_pages/yellow_pages

    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          # We tell GitHub to grab the finished file from your specific folder
          path: yellow_pages/yellow_pages/build/app/outputs/flutter-apk/app-release.apk
